# XcodeGen spec for the GenUI demo:
#   cd Examples/GenUIDemo && xcodegen generate && open GenUIDemo.xcodeproj
name: GenUIDemo
options:
  bundleIdPrefix: dev.fluidstreamkit
  deploymentTarget:
    iOS: "17.0"
packages:
  FluidStreamKit:
    path: ../..
targets:
  GenUIDemo:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FluidStreamKit
        product: FluidStreamUI
      - package: FluidStreamKit
        product: FluidStreamHostUI
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fluidstreamkit.genuidemo
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
