# XcodeGen spec for the example app:
#   cd Examples/AnthropicChat/App && xcodegen generate && open AnthropicChat.xcodeproj
name: AnthropicChat
options:
  bundleIdPrefix: dev.fluidstreamkit
  deploymentTarget:
    iOS: "17.0"
packages:
  AnthropicChat:
    path: ..
  FluidStreamKit:
    path: ../../..
targets:
  AnthropicChatApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: AnthropicChat
        product: AnthropicStreaming
      - package: FluidStreamKit
        product: FluidStreamUI
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fluidstreamkit.anthropicchat
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
